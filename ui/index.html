<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>外设电量 · 面板</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 备选 B（REVIEW-REPORT §10.3）：窗口 = 面板 720×380 DIP，四周无 30px 安全边
       （body padding: 0）。浏览器预览仍用 780×440 视口居中 .stage，仅为截图/评审
       留出外阴影显示空间。 -->
  <div class="stage" id="stage">
    <!-- 指针柔光独立层：不在 .panel 内，也不是任何 backdrop-filter 的祖先 -->
    <div class="glow-layer" id="glow-layer" aria-hidden="true">
      <span class="specular" id="specular"></span>
    </div>

    <!-- 拖拽区：整个面板（含 hero 大卡、设备列表空白、footer 提示）都可拖动。
         Tauri 2 的 "deep" 让子树任意位置命中；drag.js 会自动排除
         button/input/label/a/select/textarea/summary、[tabindex]、role=button 等
         可交互元素，因此设备行仍是点击选主卡、按钮仍是点击而非拖动。 -->
    <div class="panel" id="panel" data-tauri-drag-region="deep">
      <!-- F-02：低电卡片预烘焙高光层。红色光晕/阴影静态渲染在图层里，
           运行时只动 opacity（250ms），box-shadow 不参与任何 transition。 -->
      <div class="low-veil" id="low-veil" aria-hidden="true"></div>

      <!-- 顶部右侧：玻璃药丸控制簇 -->
      <div class="controls" id="controls" role="toolbar" aria-label="面板操作">
        <button type="button" class="ctrl" id="btn-refresh" title="立即刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button type="button" class="ctrl" id="btn-pin" title="固定面板" aria-label="固定" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 5 4 4v1H6v-1l4-4-1-5Z"/><path d="M12 13v8"/></svg>
        </button>
        <button type="button" class="ctrl" id="btn-settings" title="设置" aria-label="设置" aria-expanded="false" aria-controls="drawer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"/><path d="M19.1 14.6a1.5 1.5 0 0 0 .3 1.65l.05.05a1.8 1.8 0 1 1-2.55 2.55l-.05-.05a1.5 1.5 0 0 0-1.65-.3 1.5 1.5 0 0 0-.9 1.4v.1a1.8 1.8 0 1 1-3.6 0v-.1a1.5 1.5 0 0 0-1-1.4 1.5 1.5 0 0 0-1.65.3l-.05.05a1.8 1.8 0 1 1-2.55-2.55l.05-.05a1.5 1.5 0 0 0 .3-1.65 1.5 1.5 0 0 0-1.4-.9H4.2a1.8 1.8 0 1 1 0-3.6h.1a1.5 1.5 0 0 0 1.4-1 1.5 1.5 0 0 0-.3-1.65l-.05-.05A1.8 1.8 0 1 1 8 4.85l.05.05a1.5 1.5 0 0 0 1.65.3h.1a1.5 1.5 0 0 0 .9-1.4V3.6a1.8 1.8 0 1 1 3.6 0v.1a1.5 1.5 0 0 0 .9 1.4 1.5 1.5 0 0 0 1.65-.3l.05-.05a1.8 1.8 0 1 1 2.55 2.55l-.05.05a1.5 1.5 0 0 0-.3 1.65v.1a1.5 1.5 0 0 0 1.4.9h.1a1.8 1.8 0 1 1 0 3.6h-.1a1.5 1.5 0 0 0-1.4.9Z"/></svg>
        </button>
        <span class="ctrl-sep" aria-hidden="true"></span>
        <button type="button" class="ctrl" id="btn-min" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
        </button>
        <button type="button" class="ctrl" id="btn-close" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>

      <!-- 左：主设备（电量最低者） -->
      <section class="hero" id="hero" aria-label="主设备">
        <div class="hero-card">
          <div class="ring ring-lg" id="hero-ring">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="track" cx="50" cy="50" r="45"/>
              <circle class="glow" cx="50" cy="50" r="45"/>
              <circle class="fill" cx="50" cy="50" r="45"/>
            </svg>
            <div class="ring-center">
              <div class="ring-level" id="hero-level"><span class="num" id="hero-num">--</span><span class="pct" id="hero-pct">%</span></div>
              <div class="ring-caption" id="hero-caption">等待设备</div>
            </div>
          </div>
        </div>
        <div class="hero-meta">
          <div class="hero-title">
            <span class="hero-icon" id="hero-icon" aria-hidden="true"></span>
            <span class="hero-name" id="hero-name">等待设备</span>
          </div>
          <div class="hero-sub">
            <span class="tag" id="hero-transport">—</span>
            <span class="alert-tag" id="hero-alert" hidden>建议充电</span>
          </div>
        </div>
      </section>

      <!-- 右：设备列表 -->
      <section class="side" aria-label="设备列表">
        <!-- 拖拽区已上移到 #panel（整面板可拖），header 不再单独声明。 -->
        <header class="side-head">
          <div class="title-row">
            <h1>外设电量</h1>
            <span class="live" id="live"><i aria-hidden="true"></i><span id="live-text">在线</span></span>
          </div>
          <p class="subtitle" id="subtitle" aria-live="polite">等待设备…</p>
        </header>

        <div class="banner" id="banner" hidden>
          <span class="banner-text" id="banner-text">采集器不可用</span>
          <button type="button" class="banner-btn" id="btn-restart">重启采集器</button>
        </div>

        <div class="list" id="list" role="group" aria-label="设备列表"></div>
        <div class="empty" id="empty" hidden>未发现设备 · 等待采集器上报</div>

        <footer class="side-foot">
          <span class="hint">点击设备可设为主卡片</span>
          <button type="button" class="all-btn" id="btn-all">全部设备
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </footer>
      </section>

      <!-- 点击涟漪独立合成层（预渲染 PNG + transform） -->
      <div class="ripple-layer" id="ripple-layer" aria-hidden="true"></div>

      <!-- 告警 toast -->
      <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

      <!-- 设置抽屉：覆盖在 720×380 面板内部，不改变外框尺寸。
           drag-region="false" 显式退出整面板拖拽：scrim 点击必须能关抽屉，
           抽屉内空白处拖动也不应把窗口带走（交互控件本来就被 Tauri drag.js 排除）。 -->
      <div class="drawer-scrim" id="drawer-scrim" data-tauri-drag-region="false" hidden></div>
      <aside class="drawer" id="drawer" aria-label="设置" aria-hidden="true" data-tauri-drag-region="false" inert>
        <header class="drawer-head">
          <h2>设置</h2>
          <button type="button" class="ctrl drawer-close" id="btn-drawer-close" title="关闭设置" aria-label="关闭设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </header>
        <div class="drawer-body">
          <fieldset class="group">
            <legend>启动</legend>
            <div class="group-body">
              <label class="switch-row">
                <input type="checkbox" id="set-autostart" />
                <span class="switch" aria-hidden="true"></span>
                <span class="switch-label">开机静默启动</span>
              </label>
              <p class="status-line" id="autostart-status" data-state="off">未启用</p>
              <p class="status-note" id="autostart-note" hidden>⚠ 被系统启动项管理禁用，请在「任务管理器 → 启动」中重新启用。</p>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>外观</legend>
            <div class="group-body">
              <label class="field" for="set-opacity">
                <span class="field-label">面板不透明度</span>
                <span class="field-row">
                  <input type="range" id="set-opacity" min="50" max="100" step="1" value="60" aria-describedby="opacity-note" />
                  <output class="field-value" id="set-opacity-out" for="set-opacity">60%</output>
                </span>
              </label>
              <p class="field-note" id="opacity-note" hidden>当前系统不支持玻璃模糊，已锁定为不透明背景</p>
              <label class="check">
                <input type="checkbox" id="set-reduced" />
                <span>降低动效（关闭柔光与涟漪）</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>提醒</legend>
            <div class="group-body">
              <label class="switch-row">
                <input type="checkbox" id="set-notify-low" checked />
                <span class="switch" aria-hidden="true"></span>
                <span class="switch-label">低电系统通知</span>
              </label>
              <label class="switch-row">
                <input type="checkbox" id="set-notify-full" checked />
                <span class="switch" aria-hidden="true"></span>
                <span class="switch-label">充满系统通知</span>
              </label>
              <label class="field" for="set-threshold">
                <span class="field-label">低电阈值</span>
                <span class="field-row">
                  <input type="range" id="set-threshold" min="0" max="100" step="1" value="20" />
                  <output class="field-value" id="set-threshold-out" for="set-threshold">20%</output>
                </span>
              </label>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>面板</legend>
            <div class="group-body">
              <label class="check">
                <input type="checkbox" id="set-pinned" />
                <span>固定面板（失焦不隐藏）</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>关于</legend>
            <div class="group-body">
              <dl class="about">
                <div><dt>采集器构建</dt><dd id="info-build">—</dd></div>
                <div><dt>协议版本</dt><dd id="info-protocol">1</dd></div>
                <div><dt>应用版本</dt><dd id="info-version">—</dd></div>
                <div><dt>系统平台</dt><dd id="info-platform">—</dd></div>
                <div><dt>会话</dt><dd id="info-session">—</dd></div>
              </dl>
            </div>
          </fieldset>

          <p class="drawer-note">设置保存在本机，重启后保留。</p>
        </div>
      </aside>
    </div>
  </div>
  <script src="bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
